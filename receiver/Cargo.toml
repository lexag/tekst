[package]
name = "tekst-receiver"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.33.3", optional = true }
egui = { version = "0.33.3", optional = true }
local-ip-address = "0.6.13"
rppal = { version = "0.22.1", optional = true } 
serde = "1.0.228"
serde_json = "1.0.150"
tekst-common = { path = "../common", features = [ "egui" ] }


[features]
embedded = ["dep:rppal"]
desktop = ["dep:egui", "dep:eframe"]
startup-checks = []

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

